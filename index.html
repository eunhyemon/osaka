<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MY ARCHIVE // OSAKA 2026</title>
<style>
  @font-face {
    font-family: 'Seolnong';
    src: url('./Seolnong.woff2') format('woff2'),
         url('./Seolnong.woff') format('woff'),
         url('./Seolnong.ttf') format('truetype'),
         url('./Seolnong.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1a1a1a;
    --muted: #6e6d69;
    --line: #e2e0da;
    --accent: #1d4e89;
    --accent-bg: #eef4fb;
    --danger: #d32f2f;
    --font-main: 'Seolnong', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 36px 18px 80px;
    background-color: var(--bg);
    font-family: var(--font-main);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  button, input, select, textarea {
    font-family: var(--font-main);
  }

  .wrap {
    width: 100%;
    max-width: 680px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 20px;
    gap: 12px;
  }

  .title-area h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .title-area p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .add-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Filter Pills */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 5px 12px;
    font-size: 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-weight: 700;
  }

  /* Card Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
    border-color: #bcb9b0;
  }

  .card-link-area {
    text-decoration: none;
    color: inherit;
    display: block;
    flex: 1;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .tag {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .arrow {
    font-size: 15px;
    color: var(--muted);
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.35;
  }

  .card-desc {
    font-size: 13px;
    color: var(--muted);
    margin: 0;
    line-height: 1.45;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    color: var(--muted);
  }

  .url-preview {
    max-width: 190px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .edit-link-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
  }

  .edit-link-btn:hover {
    color: var(--ink);
  }

  /* Admin Mode Visibility Control */
  .admin-only {
    display: none !important;
  }

  body.is-admin .admin-only {
    display: inline-block !important;
  }

  body.is-admin .admin-only-flex {
    display: flex !important;
  }

  /* Bottom Utility */
  .footer-bar {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .util-btns {
    display: none;
    gap: 6px;
  }

  .util-btn {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 11.5px;
    border-radius: 5px;
    cursor: pointer;
  }

  .util-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .admin-toggle-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 11.5px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .admin-toggle-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  body.is-admin .admin-toggle-btn {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    background: var(--card);
    width: 100%;
    max-width: 390px;
    padding: 22px;
    border-radius: 12px;
    border: 1px solid var(--ink);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.18);
  }

  .modal h3 {
    margin: 0 0 16px;
    font-size: 17px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    margin-bottom: 5px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13.5px;
    background: #fff;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--ink);
  }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }

  .btn-save {
    flex: 2;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel {
    flex: 1;
    background: #f3f2ee;
    border: none;
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
  }

  .btn-del {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 10px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <div class="title-area">
      <h1>MY ARCHIVE</h1>
      <p>OSAKA 2026 · PERSONAL WEB INDEX</p>
    </div>
    <button type="button" class="add-btn admin-only" onclick="openModal()">+ 새 링크</button>
  </header>

  <div class="filter-bar" id="filter-bar"></div>

  <div class="grid" id="card-grid"></div>

  <footer class="footer-bar">
    <span>JP-2026 DIRECTORY</span>
    <div class="footer-right">
      <div class="util-btns admin-only-flex">
        <button type="button" class="util-btn" onclick="exportData()">백업</button>
        <button type="button" class="util-btn" onclick="document.getElementById('import-input').click()">불러오기</button>
        <button type="button" class="util-btn" onclick="resetDefault()">초기화</button>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
      </div>
      <button type="button" class="admin-toggle-btn" id="admin-toggle-btn" onclick="toggleAdminMode()">🔒 ADMIN</button>
    </div>
  </footer>
</div>

<!-- Add / Edit Link Modal -->
<div class="modal-backdrop" id="link-modal">
  <div class="modal">
    <h3 id="modal-heading">새 링크 추가</h3>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="in-title" placeholder="예: 커플 오사카 플래너">
    </div>
    <div class="form-group">
      <label>카테고리 태그</label>
      <input type="text" id="in-tag" placeholder="예: PLANNER, SHOPPING, MAP">
    </div>
    <div class="form-group">
      <label>링크 주소 (상대경로 또는 https://...)</label>
      <input type="text" id="in-url" placeholder="예: ./plan/ 또는 https://...">
    </div>
    <div class="form-group">
      <label>한 줄 설명</label>
      <input type="text" id="in-desc" placeholder="예: 예약 스탬프 및 일자별 일정 타임라인">
    </div>
    <div class="modal-btns">
      <button type="button" class="btn-del" id="btn-del" onclick="deleteLink()" style="display:none;">삭제</button>
      <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
      <button type="button" class="btn-save" onclick="saveLink()">저장</button>
    </div>
  </div>
</div>

<script>
  const ADMIN_PW = "0000";
  const ADMIN_SESSION_KEY = "osaka_hub_admin_unlocked_v1";
  const STORAGE_KEY = "hailey_web_archive_v2";

  const defaultLinks = [
    {
      id: "link_planner",
      tag: "PLANNER",
      title: "커플 오사카 플래너",
      url: "./plan/",
      desc: "예약 스탬프 & 날짜별 일정 타임라인 (구글 시트 공동 동기화)"
    },
    {
      id: "link_my_receipt",
      tag: "SHOPPING",
      title: "내 전용 쇼핑 · 준비물",
      url: "./my-receipt/",
      desc: "면세 계산기, 품목 사진, 캐리어 체크리스트 (내 시트 연동)"
    },
    {
      id: "link_bf_receipt",
      tag: "SHOPPING",
      title: "남자친구 전용 쇼핑 · 준비물",
      url: "./bf-receipt/",
      desc: "남친 구매 리스트 & 개인 준비물 영수증 (시트 연동)"
    }
  ];

  let links = loadLinks();
  let currentFilter = "ALL";
  let editingId = null;
  let isAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY) === "true";

  function applyAdminState() {
    document.body.classList.toggle("is-admin", isAdmin);
    const btn = document.getElementById("admin-toggle-btn");
    btn.textContent = isAdmin ? "🔓 LOCK" : "🔒 ADMIN";
  }

  function toggleAdminMode() {
    if (isAdmin) {
      isAdmin = false;
      sessionStorage.removeItem(ADMIN_SESSION_KEY);
      applyAdminState();
      return;
    }

    const input = prompt("관리자 비밀번호를 입력하세요:");
    if (input === null) return;
    if (input === ADMIN_PW) {
      isAdmin = true;
      sessionStorage.setItem(ADMIN_SESSION_KEY, "true");
      applyAdminState();
    } else {
      alert("비밀번호가 올바르지 않습니다.");
    }
  }

  function loadLinks() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultLinks));
  }

  function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }

  function resetDefault() {
    if (!isAdmin) return;
    if (!confirm("기본 링크 목록으로 되돌릴까요?")) return;
    links = JSON.parse(JSON.stringify(defaultLinks));
    saveToStorage();
    currentFilter = "ALL";
    render();
  }

  function openModal(id = null) {
    if (!isAdmin) return;
    editingId = id;
    if (id) {
      const item = links.find(l => l.id === id);
      document.getElementById("modal-heading").textContent = "링크 수정";
      document.getElementById("in-title").value = item.title;
      document.getElementById("in-tag").value = item.tag;
      document.getElementById("in-url").value = item.url;
      document.getElementById("in-desc").value = item.desc;
      document.getElementById("btn-del").style.display = "block";
    } else {
      document.getElementById("modal-heading").textContent = "새 링크 추가";
      document.getElementById("in-title").value = "";
      document.getElementById("in-tag").value = "ETC";
      document.getElementById("in-url").value = "";
      document.getElementById("in-desc").value = "";
      document.getElementById("btn-del").style.display = "none";
    }
    document.getElementById("link-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("link-modal").classList.remove("open");
    editingId = null;
  }

  function saveLink() {
    if (!isAdmin) return;
    const title = document.getElementById("in-title").value.trim();
    const tag = (document.getElementById("in-tag").value.trim() || "ETC").toUpperCase();
    const url = document.getElementById("in-url").value.trim();
    const desc = document.getElementById("in-desc").value.trim();

    if (!title || !url) {
      alert("제목과 링크 주소를 입력해 주세요.");
      return;
    }

    if (editingId) {
      const item = links.find(l => l.id === editingId);
      item.title = title;
      item.tag = tag;
      item.url = url;
      item.desc = desc;
    } else {
      links.push({
        id: "link_" + Date.now(),
        title,
        tag,
        url,
        desc
      });
    }

    saveToStorage();
    closeModal();
    render();
  }

  function deleteLink() {
    if (!isAdmin || !editingId) return;
    if (!confirm("이 링크 카드를 삭제할까요?")) return;
    links = links.filter(l => l.id !== editingId);
    saveToStorage();
    closeModal();
    render();
  }

  function setFilter(tag) {
    currentFilter = tag;
    render();
  }

  function exportData() {
    if (!isAdmin) return;
    const blob = new Blob([JSON.stringify(links, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "my-archive-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  }

  function importData(event) {
    if (!isAdmin) return;
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (Array.isArray(parsed)) {
          links = parsed;
          saveToStorage();
          currentFilter = "ALL";
          render();
          alert("백업 목록을 불러왔습니다.");
        }
      } catch (err) {
        alert("올바른 백업 파일이 아닙니다.");
      }
    };
    reader.readAsText(file);
    event.target.value = "";
  }

  function render() {
    const tags = ["ALL", ...new Set(links.map(l => l.tag))];
    if (!tags.includes(currentFilter)) currentFilter = "ALL";

    const filterBar = document.getElementById("filter-bar");
    filterBar.innerHTML = tags.map(t =>
      '<button type="button" class="filter-btn ' + (currentFilter === t ? 'active' : '') + '" onclick="setFilter(\'' + t + '\')">' + t + '</button>'
    ).join("");

    const filtered = currentFilter === "ALL" ? links : links.filter(l => l.tag === currentFilter);
    const grid = document.getElementById("card-grid");

    grid.innerHTML = filtered.map(item =>
      '<div class="card">' +
        '<a class="card-link-area" href="' + item.url + '">' +
          '<div class="card-top">' +
            '<span class="tag">' + item.tag + '</span>' +
            '<span class="arrow">↗</span>' +
          '</div>' +
          '<div class="card-title">' + item.title + '</div>' +
          '<p class="card-desc">' + (item.desc || '') + '</p>' +
        '</a>' +
        '<div class="card-footer">' +
          '<span class="url-preview">' + item.url + '</span>' +
          '<button type="button" class="edit-link-btn admin-only" onclick="openModal(\'' + item.id + '\')">수정</button>' +
        '</div>' +
      '</div>'
    ).join("");
  }

  applyAdminState();
  render();
</script>
</body>
</html>
