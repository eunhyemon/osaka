<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MY ARCHIVE // OSAKA 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Kosugi+Maru&display=swap');

  @font-face {
    font-family: 'Seolnong';
    src: url('./Seolnong.woff2') format('woff2'),
         url('./Seolnong.woff') format('woff'),
         url('./Seolnong.ttf') format('truetype'),
         url('./Seolnong.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --ink: #111111;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --accent: #1d4e89;
    --danger: #d32f2f;
    --font-main: 'Arimo', 'Kosugi Maru', 'Seolnong', -apple-system, sans-serif;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    padding: 32px 16px 80px;
    background-color: var(--bg);
    font-family: var(--font-main);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }

  button, input, select {
    font-family: var(--font-main);
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1.5px solid var(--ink);
    padding-bottom: 16px;
    margin-bottom: 20px;
    gap: 12px;
  }

  .title-area h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .title-area p {
    margin: 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .add-btn {
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 9px 14px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .add-btn:active {
    opacity: 0.85;
  }

  /* Filter Pills */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
    font-weight: 700;
  }

  /* Grid Cards */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 480px) {
    .grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .card:hover {
    border-color: var(--ink);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .cat-tag {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
    background: rgba(29, 78, 137, 0.08);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .arrow-icon {
    font-size: 14px;
    color: var(--muted);
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.3;
  }

  .card-desc {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 14px;
    line-height: 1.45;
    word-break: keep-all;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line);
    padding-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }

  .edit-link-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    padding: 2px 4px;
    text-decoration: underline;
  }

  .edit-link-btn:hover {
    color: var(--ink);
  }

  /* Footer Util */
  .footer-bar {
    margin-top: 28px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: var(--muted);
  }

  .util-group {
    display: flex;
    gap: 8px;
  }

  .text-btn {
    background: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    padding: 5px 9px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }

  .text-btn:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 380px;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid var(--ink);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
  }

  .modal h3 {
    margin: 0 0 14px;
    font-size: 16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
  }

  .form-group {
    margin-bottom: 12px;
  }

  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .form-group input, .form-group select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 13.5px;
  }

  .form-group input:focus, .form-group select:focus {
    outline: none;
    border-color: var(--ink);
  }

  .modal-btns {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .btn-primary {
    flex: 2;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel {
    flex: 1;
    background: #fff;
    border: 1px solid var(--line);
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
  }

  .btn-delete {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="title-area">
      <h1>MY ARCHIVE</h1>
      <p>OSAKA 2026 · PERSONAL WEB INDEX</p>
    </div>
    <button type="button" class="add-btn" onclick="openModal()">+ 새 링크</button>
  </header>

  <nav class="filter-bar" id="filter-bar">
    <button type="button" class="filter-btn active" onclick="setFilter('ALL')">ALL</button>
    <button type="button" class="filter-btn" onclick="setFilter('PLANNER')">PLANNER</button>
    <button type="button" class="filter-btn" onclick="setFilter('SHOPPING')">SHOPPING</button>
    <button type="button" class="filter-btn" onclick="setFilter('ETC')">ETC</button>
  </nav>

  <main class="grid" id="link-grid"></main>

  <footer class="footer-bar">
    <span>JP-2026 DIRECTORY</span>
    <div class="util-group">
      <button type="button" class="text-btn" onclick="exportLinks()">백업</button>
      <button type="button" class="text-btn" onclick="document.getElementById('import-file').click()">불러오기</button>
      <button type="button" class="text-btn" onclick="resetLinks()">초기화</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importLinks(event)">
    </div>
  </footer>
</div>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" id="link-modal">
  <div class="modal">
    <h3 id="modal-title">새 링크 추가</h3>
    <div class="form-group">
      <label>카테고리</label>
      <select id="edit-cat">
        <option value="PLANNER">PLANNER</option>
        <option value="SHOPPING">SHOPPING</option>
        <option value="ETC">ETC</option>
      </select>
    </div>
    <div class="form-group">
      <label>사이트 제목</label>
      <input type="text" id="edit-title" placeholder="예: 오사카 커플 플래너">
    </div>
    <div class="form-group">
      <label>설명 (한 줄 메모)</label>
      <input type="text" id="edit-desc" placeholder="예: 예약 도장 & 일정 타임라인 (시트 연동)">
    </div>
    <div class="form-group">
      <label>링크 주소 (상대 경로 또는 https://...)</label>
      <input type="text" id="edit-url" placeholder="./plan/ 또는 https://...">
    </div>
    <div class="modal-btns">
      <button type="button" class="btn-delete" id="del-btn" onclick="deleteLink()" style="display:none;">삭제</button>
      <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
      <button type="button" class="btn-primary" onclick="saveLink()">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "my_archive_links_osaka_v1";

  const defaultLinks = [
    {
      id: "l1",
      cat: "PLANNER",
      title: "커플 오사카 플래너",
      desc: "예약 스탬프 & 날짜별 일정 타임라인 (구글 시트 공동 동기화)",
      url: "./plan/"
    },
    {
      id: "l2",
      cat: "SHOPPING",
      title: "내 전용 쇼핑 · 준비물",
      desc: "면세 계산기, 품목 사진, 캐리어 체크리스트 (내 시트 연동)",
      url: "./my-receipt/"
    },
    {
      id: "l3",
      cat: "SHOPPING",
      title: "남자친구 전용 쇼핑 · 준비물",
      desc: "남친 구매 리스트 & 개인 준비물 영수증 (시트 연동)",
      url: "./bf-receipt/"
    }
  ];

  let links = loadLinks();
  let currentFilter = "ALL";
  let editingId = null;

  function loadLinks() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultLinks));
  }

  function persistLinks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }

  function setFilter(cat) {
    currentFilter = cat;
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.classList.toggle("active", btn.textContent === cat);
    });
    render();
  }

  function openModal(id = null) {
    editingId = id;
    if (id) {
      const item = links.find(l => l.id === id);
      document.getElementById("modal-title").textContent = "링크 수정";
      document.getElementById("edit-cat").value = item.cat;
      document.getElementById("edit-title").value = item.title;
      document.getElementById("edit-desc").value = item.desc;
      document.getElementById("edit-url").value = item.url;
      document.getElementById("del-btn").style.display = "block";
    } else {
      document.getElementById("modal-title").textContent = "새 링크 추가";
      document.getElementById("edit-cat").value = currentFilter === "ALL" ? "PLANNER" : currentFilter;
      document.getElementById("edit-title").value = "";
      document.getElementById("edit-desc").value = "";
      document.getElementById("edit-url").value = "";
      document.getElementById("del-btn").style.display = "none";
    }
    document.getElementById("link-modal").classList.add("open");
  }

  function closeModal() {
    document.getElementById("link-modal").classList.remove("open");
    editingId = null;
  }

  function saveLink() {
    const cat = document.getElementById("edit-cat").value;
    const title = document.getElementById("edit-title").value.trim();
    const desc = document.getElementById("edit-desc").value.trim();
    let url = document.getElementById("edit-url").value.trim();

    if (!title || !url) {
      alert("제목과 링크 주소를 입력해 주세요.");
      return;
    }

    if (!url.startsWith("./") && !url.startsWith("/") && !url.startsWith("http://") && !url.startsWith("https://")) {
      url = "https://" + url;
    }

    if (editingId) {
      const item = links.find(l => l.id === editingId);
      item.cat = cat;
      item.title = title;
      item.desc = desc;
      item.url = url;
    } else {
      links.push({
        id: "link_" + Date.now(),
        cat,
        title,
        desc,
        url
      });
    }
    persistLinks();
    closeModal();
    render();
  }

  function deleteLink() {
    if (!editingId) return;
    if (!confirm("이 링크를 삭제할까요?")) return;
    links = links.filter(l => l.id !== editingId);
    persistLinks();
    closeModal();
    render();
  }

  function resetLinks() {
    if (!confirm("기본 3개 링크(플래너, 내 영수증, 남친 영수증)로 초기화할까요?")) return;
    links = JSON.parse(JSON.stringify(defaultLinks));
    persistLinks();
    render();
  }

  function exportLinks() {
    const blob = new Blob([JSON.stringify(links, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "my-archive-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
  }

  function importLinks(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (Array.isArray(parsed)) {
          links = parsed;
          persistLinks();
          render();
          alert("링크 목록을 불러왔습니다.");
        }
      } catch (err) {
        alert("올바른 백업 파일이 아닙니다.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  function render() {
    const grid = document.getElementById("link-grid");
    const filtered = currentFilter === "ALL" ? links : links.filter(l => l.cat === currentFilter);

    if (filtered.length === 0) {
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:36px 12px; color:var(--muted); font-size:13px; border:1px dashed var(--line); border-radius:8px;">등록된 링크가 없습니다. 우측 상단 <strong>+ 새 링크</strong>로 추가해 주세요.</div>';
      return;
    }

    grid.innerHTML = filtered.map(item => `
      <a class="card" href="${item.url}">
        <div>
          <div class="card-top">
            <span class="cat-tag">${item.cat}</span>
            <span class="arrow-icon">↗</span>
          </div>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-desc">${item.desc || "&nbsp;"}</p>
        </div>
        <div class="card-footer">
          <span>${item.url}</span>
          <button type="button" class="edit-link-btn" onclick="event.preventDefault(); event.stopPropagation(); openModal('${item.id}')">수정</button>
        </div>
      </a>
    `).join("");
  }

  render();
</script>
</body>
</html>
