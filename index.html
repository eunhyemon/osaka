<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MY ARCHIVE // OSAKA 2026</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="wrap">
  <header class="header">
    <div class="title-area">
      <h1>MY ARCHIVE</h1>
      <p>OSAKA 2026 · PERSONAL WEB INDEX</p>
    </div>
    <button type="button" class="add-btn admin-only" onclick="openLinkModal()">+ 새 링크</button>
  </header>

  <!-- Shared Couple Checklist -->
  <section class="checklist-box" aria-label="공통 체크리스트">
    <div class="cl-header">
      <div class="cl-title">🤝 공통 체크리스트 (같이 준비할 것)</div>
      <div class="cl-status-wrap">
        <span class="cl-sync-badge" id="cl-sync-status">동기화 대기</span>
        <span class="cl-count" id="cl-count">0 / 0</span>
      </div>
    </div>
    <ul class="cl-list" id="cl-list"></ul>
    <div class="cl-add-row">
      <input type="text" id="cl-new-input" class="cl-input" placeholder="+ 새 공통 체크 항목 입력..." onkeydown="if(event.key==='Enter') addCheckItem()">
      <button type="button" class="cl-add-btn" onclick="addCheckItem()">+ 추가</button>
    </div>
  </section>

  <!-- Filter Pills -->
  <div class="filter-bar" id="filter-bar"></div>

  <!-- Directory Cards -->
  <div class="grid" id="card-grid"></div>

  <!-- Footer -->
  <footer class="footer-bar">
    <span>JP-2026 DIRECTORY</span>
    <div class="footer-right">
      <div class="util-btns admin-only-flex">
        <button type="button" class="util-btn" onclick="exportData()">백업</button>
        <button type="button" class="util-btn" onclick="document.getElementById('import-input').click()">불러오기</button>
        <button type="button" class="util-btn" onclick="openResetModal()">초기화</button>
        <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
      </div>
      <button type="button" class="admin-toggle-btn" id="admin-toggle-btn" onclick="handleAdminClick()">🔒 ADMIN</button>
    </div>
  </footer>
</div>

<!-- Admin Password Modal -->
<div class="modal-backdrop" id="pw-modal">
  <div class="modal">
    <h3>관리자 모드 잠금 해제</h3>
    <p class="modal-sub">링크 카드 추가·수정 및 백업 기능을 사용하려면 비밀번호를 입력하세요.</p>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" id="pw-input" placeholder="0000" maxlength="10" onkeydown="if(event.key==='Enter') submitAdminPw()">
      <div class="error-msg" id="pw-error">비밀번호가 올바르지 않습니다.</div>
    </div>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" onclick="closePwModal()">취소</button>
      <button type="button" class="btn-save" onclick="submitAdminPw()">잠금 해제</button>
    </div>
  </div>
</div>

<!-- Edit Checklist Item Modal -->
<div class="modal-backdrop" id="cl-edit-modal">
  <div class="modal">
    <h3>체크리스트 항목 수정</h3>
    <div class="form-group">
      <label>내용</label>
      <input type="text" id="cl-edit-input" onkeydown="if(event.key==='Enter') saveEditedCheckItem()">
    </div>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" onclick="closeClEditModal()">취소</button>
      <button type="button" class="btn-save" onclick="saveEditedCheckItem()">저장</button>
    </div>
  </div>
</div>

<!-- Add / Edit Link Modal -->
<div class="modal-backdrop" id="link-modal">
  <div class="modal">
    <h3 id="modal-heading">새 링크 추가</h3>
    <div class="form-group">
      <label>제목</label>
      <input type="text" id="in-title" placeholder="예: 커플 오사카 플래너">
    </div>
    <div class="form-group">
      <label>카테고리 태그</label>
      <input type="text" id="in-tag" placeholder="예: PLANNER, SHOPPING, MAP">
    </div>
    <div class="form-group">
      <label>링크 주소 (상대경로 또는 https://...)</label>
      <input type="text" id="in-url" placeholder="예: ./plan/ 또는 https://...">
    </div>
    <div class="form-group">
      <label>한 줄 설명</label>
      <input type="text" id="in-desc" placeholder="예: 예약 스탬프 및 일자별 일정 타임라인">
    </div>
    <div class="modal-btns">
      <button type="button" class="btn-del" id="btn-del" onclick="deleteLink()" style="display:none;">삭제</button>
      <button type="button" class="btn-cancel" onclick="closeLinkModal()">취소</button>
      <button type="button" class="btn-save" onclick="saveLink()">저장</button>
    </div>
  </div>
</div>

<!-- Confirm Reset Modal -->
<div class="modal-backdrop" id="reset-modal">
  <div class="modal">
    <h3>기본 목록으로 초기화</h3>
    <p class="modal-sub">현재 저장된 링크 카드 목록을 초기 3개 카드 상태로 되돌릴까요?</p>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" onclick="closeResetModal()">취소</button>
      <button type="button" class="btn-del" style="flex:1;" onclick="confirmReset()">초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./app.js"></script>
</body>
</html>
