<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<title>OSAKA SHOPPING BAG — HAILEY</title>
<meta name="description" content="오사카 쇼핑 리스트를 장바구니에 담아보는 작은 놀이.">
<link rel="stylesheet" href="./style.css?v=plastic-soft-v6">
<script defer src="./app.js?v=all-items-v4"></script>
</head>
<body>
<main class="app">
  <header class="top">
    <a class="back" href="../my-receipt/" aria-label="영수증으로 돌아가기">← MY RECEIPT</a>
    <span class="top-brand">HAILEY'S OSAKA <span class="dot"></span> 2026</span>
    <a class="archive-link" href="../">ARCHIVE ↗</a>
  </header>

  <section class="experience" aria-label="쇼핑백에 상품 담기">
    <div class="bag-zone" id="bag-zone" role="region" aria-label="상품을 놓아 담는 쇼핑백">
      <div class="bag-scene" id="bag-scene">
        <div class="bag-fill" id="bag-fill" aria-hidden="true"></div>
        <svg class="bag-skin" viewBox="0 0 520 540" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="plastic-film" x1="0%" y1="0%" x2="95%" y2="85%">
              <stop offset="0%" stop-color="#f7f7f5" stop-opacity=".61"/>
              <stop offset="48%" stop-color="#f0f1ee" stop-opacity=".40"/>
              <stop offset="100%" stop-color="#e7e9e6" stop-opacity=".55"/>
            </linearGradient>
          </defs>
          <!-- One intentionally uneven cut-paper silhouette: handles are negative space. -->
          <path d="M108 41 L128 67 L204 48 L178 186 L289 211 L275 52 L340 65 L486 243 L513 497 L268 532 L16 497 L16 247 Z"
            fill="url(#plastic-film)"/>
          <!-- Faint fold in the polyethylene, rather than a dimensional side panel. -->
          <path d="M16 497 L268 532 L513 497" fill="none"
            stroke="#d5d9d5" stroke-opacity=".23" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="items scattered-items" id="items" aria-label="쇼핑백 주변에 흩어진 상품"></div>
      <div class="drop-instruction" id="drop-instruction">DRAG TO BAG ↗</div>
      <span class="bag-stamp" aria-hidden="true">お買い物<br>クラブ</span>
    </div>

    <div class="scene-controls">
      <span class="micro">DRAG THE OBJECTS INTO THE BAG <span id="product-count">00</span></span>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">쇼핑 목록을 불러오는 중…</div>

    <div class="bottom">
      <div class="totals">
        <span class="micro">IN MY BAG <b id="bag-count">00</b> PCS</span>
        <div class="total"><span id="total-yen">¥0</span><small id="total-won">≈ ₩0</small></div>
      </div>
      <div class="bottom-actions">
        <button class="empty-btn" id="empty-btn" type="button">EMPTY BAG ×</button>
        <a class="receipt-btn" href="../my-receipt/">VIEW RECEIPT ↗</a>
      </div>
    </div>
    <div class="bag-items" id="bag-items" aria-label="쇼핑백에 담긴 상품"></div>
  </section>

  <footer>
    <span>A LITTLE TOO MUCH? NEVER.</span>
    <span>MADE FOR OSAKA, WITH LOVE.</span>
  </footer>
</main>
</body>
</html>
